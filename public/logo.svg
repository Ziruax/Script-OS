<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#ecfdf5" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background with emerald gradient -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner highlight ring -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Film-clapper / script-page motif combined with a play triangle -->
  <!-- Top clapper bar -->
  <g filter="url(#soft)">
    <rect x="120" y="132" width="272" height="44" rx="10" fill="url(#stroke)"/>
    <!-- Clapper stripes -->
    <polygon points="148,132 168,176 188,176 168,132" fill="#10b981" opacity="0.85"/>
    <polygon points="208,132 228,176 248,176 228,132" fill="#10b981" opacity="0.85"/>
    <polygon points="268,132 288,176 308,176 288,132" fill="#10b981" opacity="0.85"/>
    <polygon points="328,132 348,176 368,176 348,132" fill="#10b981" opacity="0.85"/>
  </g>

  <!-- Script body (rounded rectangle) -->
  <rect x="120" y="188" width="272" height="208" rx="14" fill="url(#stroke)"/>

  <!-- Lines representing script text -->
  <rect x="146" y="218" width="150" height="8" rx="4" fill="#10b981" opacity="0.45"/>
  <rect x="146" y="238" width="220" height="8" rx="4" fill="#10b981" opacity="0.35"/>
  <rect x="146" y="258" width="180" height="8" rx="4" fill="#10b981" opacity="0.35"/>

  <!-- Play triangle (the "generate" CTA) -->
  <path d="M210 290 L300 336 L210 382 Z" fill="#10b981"/>
</svg>
